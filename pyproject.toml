[project]
name = "corte"
version = "1.0.0"
description = "Ferramenta de print, recorte, gravação e OCR via terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.80.0",
  "mss>=9.0.0",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0",
  "pytesseract>=0.3.13",
  "pyperclip>=1.8.2",
]

[project.scripts]
corte = "corte.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["corte*"]
